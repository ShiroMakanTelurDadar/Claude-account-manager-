<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04070c">
  <title>Claude Account Manager</title>
  <script>
    /* Penangkap galat: kalau ada skrip yang gagal, pesannya tampil di layar (ketuk kotak merah untuk menutup) */
    (function () {
      var box = null, n = 0;
      function show(t) {
        if (n++ > 6) return;
        if (!box) {
          box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;z-index:99999;max-height:45vh;overflow:auto;padding:8px 10px;border-radius:10px;background:#7f1d1d;color:#fff;font:11px/1.4 monospace;white-space:pre-wrap;word-break:break-all';
          box.addEventListener('click', function () { box.remove(); box = null; n = 0; });
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent += t + '\n\n';
      }
      window.addEventListener('error', function (e) { show('ERR ' + (e.message || '') + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno); });
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('REJ ' + (r && (r.stack || r.message) || r)); });
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="relay.css">
  <link rel="stylesheet" href="chat.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <button id="menuBtn" class="menubtn" type="button" aria-label="Buka menu: riwayat, ekspor, impor"><span></span><span></span><span></span></button>
    <h1>Account Manager</h1>
    <button id="ctlBtn" class="ctlbtn" type="button" aria-label="Control: akun, keamanan, tampilan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Control
    </button>
  </header>
  <div id="summary"></div>

  <form id="addForm">
    <input id="newName" placeholder="Tambah akun (mis. email)" required autocomplete="off">
    <button type="submit" class="btn">+ Tambah</button>
  </form>

  <main id="list"></main>
  <p class="hint" id="empty" hidden>Belum ada akun. Tambahkan satu di atas.</p>
  <div id="toast" hidden></div>

  <script src="auth.js"></script>
  <script src="control.js"></script>
  <script src="app.js"></script>
  <script src="relay-core.js"></script>
  <script src="relay.js"></script>
  <script src="chat.js"></script>
</body>
</html>
